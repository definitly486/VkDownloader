name: Android build and release

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
   
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'



      - name: Configure stable release signing (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
            {
              echo "KEYSTORE_FILE=release-keystore.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "No signing secrets configured; release APK will be unsigned. Debug APK will also be published as an installable fallback."
          fi

      - name: Validate Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk release-assets/ 2>/dev/null || true
          if [ "$STABLE_SIGNING" != "true" ]; then
            mv release-assets/app-release.apk release-assets/app-release-unsigned.apk 2>/dev/null || true
          fi
          test -n "$(find release-assets -maxdepth 1 -name '*.apk' -print -quit)"
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VkDownloader-APKs-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for this push
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "VK Downloader build ${{ github.run_number }}"
          body: |
            Automated Android build from commit `${{ github.sha }}`.

            Branch: `${{ github.ref_name }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            If `app-release-unsigned.apk` is present, configure repository signing secrets to publish a stable, signed release APK. The debug APK is signed with Android's debug key and is intended for testing.
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
